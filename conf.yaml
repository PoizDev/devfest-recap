server: 
  port: ":1923"
  shutdown_timeout: "30s"
  active_level: "dev"
  env_path: ".env"
  recap_mode: false

database:
  max_idle_conns: 25
  max_open_conns: 45
  conn_max_lifetime: "5m"
  conn_max_idle_time: "1m"
  conn_timeout: "15s"
  ping_period: "30s"

redis:
  host: "localhost"
  port: 6379
  db: 0
  pool_size: 10
  min_idle_conns: 3

jwt:
  expiration: 24h

rate_limit:
  rpm: 100
  burst_size: 10
  window_duration: 1m
  